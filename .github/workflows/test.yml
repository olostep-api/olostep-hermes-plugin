name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install "httpx>=0.27,<1" pytest==9.0.2 pytest-asyncio==1.3.0 "ruff>=0.15,<0.17"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -v
